# Publishing is disabled in this fork.
#
# The PyPI project `freqtrade-mcp-server` belongs to the upstream repository
# (yalcin/freqtrade-mcp), and so do the author and project URLs in
# pyproject.toml. Trusted publishing is configured for upstream, not for this
# fork, so a `v*` tag pushed here would either fail or publish under someone
# else's project identity. Changes made here are meant to go upstream as pull
# requests.
#
# The build job below still runs on demand so packaging stays verifiable.
# To restore automatic publishing in a fork you would need to: pick a distinct
# `name` in pyproject.toml, update authors/urls, configure trusted publishing
# for this repository, and re-add the `on: push: tags: - "v*"` trigger plus the
# `pypa/gh-action-pypi-publish` step.
name: Release (build only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install build tools
        run: pip install build
      - name: Build package
        run: python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
