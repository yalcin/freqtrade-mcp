name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/
      - name: Type check
        run: mypy src/
      - name: Test
        run: pytest
      # freqtrade declares scipy only under its "hyperopt" extra, while
      # freqtrade.data.metrics imports it unconditionally — so on a stock
      # install the strategy interface cannot be imported and every
      # integration test silently skips. Install the extra and run them for
      # real: they are the only tests that exercise the live package.
      - name: Install freqtrade extras for integration tests
        run: pip install "freqtrade[hyperopt]"
      - name: Integration tests
        run: |
          set -o pipefail
          pytest -m integration --no-cov -q | tee result.txt
          grep -qE "[0-9]+ passed" result.txt || {
            echo "::error::Integration tests did not run - freqtrade is not importable."
            exit 1
          }
